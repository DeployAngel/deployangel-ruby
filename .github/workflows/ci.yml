name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # The agent supports Ruby 3.1, Rails 7.1, Hanami 2.2, and Sinatra 3.0 or
  # later, so it runs on the oldest and newest of each.
  test:
    name: Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }}${{ matrix.hanami && format(', Hanami {0}', matrix.hanami) || '' }}${{ matrix.sinatra && format(', Sinatra {0}', matrix.sinatra) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.1", rails: "7.1" }
          - { ruby: "3.1", rails: "7.2" }
          - { ruby: "3.2", rails: "8.0" }
          - { ruby: "3.3", rails: "8.1" }
          - { ruby: "3.4", rails: "8.1" }
          - { ruby: "4.0", rails: "8.1" }
          # Hanami 2.2 runs on Ruby 3.1 and Rack 2; Hanami 3 needs Ruby 3.3.
          - { ruby: "3.1", rails: "7.2", hanami: "2.2" }
          - { ruby: "3.4", rails: "8.1", hanami: "3.0" }
          # Sinatra 3 runs on Rack 2, Sinatra 4 on Rack 3.
          - { ruby: "3.1", rails: "7.2", sinatra: "3.0" }
          - { ruby: "3.4", rails: "8.1", sinatra: "4.2" }
    env:
      ACTIVEJOB_VERSION: ${{ matrix.rails }}
      HANAMI_VERSION: ${{ matrix.hanami }}
      SINATRA_VERSION: ${{ matrix.sinatra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A gem doesn't commit its Gemfile.lock, so gems install fresh.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: bundle exec rspec
