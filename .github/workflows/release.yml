name: Release

# Pushing a version tag (v0.1.0, by bin/release) builds the gem, publishes it
# to RubyGems once a maintainer approves the rubygems environment, and then
# creates a GitHub release whose notes are that version's section of
# CHANGELOG.md.
#
# RubyGems trusts this workflow directly (trusted publishing), so there's no
# API key anywhere: the deployangel gem's trusted publisher names this
# repository, release.yml, and the rubygems environment. Pushes from a
# maintainer's machine still need MFA.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check the tag, version, and CHANGELOG agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^  VERSION = "\(.*\)"$/\1/p' lib/deployangel/version.rb)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in lib/deployangel/version.rb."
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Run tests
        run: bundle exec rspec

      - name: Build
        run: gem build deployangel.gemspec

      - uses: actions/upload-artifact@v7
        with:
          name: gem
          path: "*.gem"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/deployangel
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gem

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # Exchanges this job's GitHub identity for a short-lived RubyGems key.
      # Pinned to a commit, as RubyGems' own release-gem action pins it.
      - name: Get RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push *.gem

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: gem

      - name: Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists."
            exit 0
          fi

          # The lines under "## <version> (date)", up to the next heading,
          # without leading or trailing blank lines.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] == "") first++
              last = n;  while (last >= first && lines[last] == "") last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md

          gh release create "$TAG" *.gem --title "deployangel $version" --notes-file notes.md
